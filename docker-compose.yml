# App only — infrastructure runs separately in ../infra/
# Requires infra to be running first: cd infra && docker compose up -d
#
# Start:   docker compose up -d --build
# Stop:    docker compose down
# Logs:    docker compose logs -f app

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rideorbit-app
    expose:
      - "8080"
    env_file:
      - .env    # exists on server only — never committed to git
    deploy:
      resources:
        limits:
          memory: 700M
          cpus: '0.4'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - infra-net

networks:
  infra-net:
    external: true
    name: infra-net
